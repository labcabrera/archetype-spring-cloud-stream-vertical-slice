plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.7'
	id 'io.spring.dependency-management' version '1.1.7'
	// openapi generator plugin intentionally not applied; CLI jar used instead
	id 'org.sonarqube' version '6.0.1.5171'
	id 'jacoco'
}

group = 'org.labcabrera.sample'
version = '0.1.0-SNAPSHOT'
description = 'Archetype for Spring Boot using Spring Cloud Stream'

ext {
	logstashLogbackVersion = '7.4'
	springdocVersion = '2.7.0'
	swaggerAnnotationsVersion = '2.2.13'
	springCloudVersion = '2025.0.0'
	rsqlParserVersion = '2.1.0'
	mapstructVersion = '1.5.5.Final'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-cache'
	implementation 'org.springframework.cloud:spring-cloud-stream'
	implementation 'org.springframework.cloud:spring-cloud-stream-binder-kafka'
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
	implementation "net.logstash.logback:logstash-logback-encoder:${logstashLogbackVersion}"
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
	implementation "cz.jirutka.rsql:rsql-parser:${rsqlParserVersion}"
	implementation "org.mapstruct:mapstruct:${mapstructVersion}"

	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

	compileOnly 'org.projectlombok:lombok'
  	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

// OpenAPI generator CLI integration: download CLI jar and run it via `java -jar`
configurations {
	openapiGenerator
}

dependencies {
	openapiGenerator "org.openapitools:openapi-generator-cli:6.6.0"
}

// Configure input/output and packages for generated code
def openApiInput = "${projectDir}/src/main/resources/api/api.yaml"
def openApiOutput = "${buildDir}/generated/sources/openapi"
def openApiApiPackage = 'org.labcabrera.sample.archetype.generated.api'
def openApiModelPackage = 'org.labcabrera.sample.archetype.generated.model'
def openApiInvokerPackage = 'org.labcabrera.sample.archetype.generated.invoker'

task openApiGenerate(type: Exec) {
	group = 'openapi'
	description = 'Generate server stub from OpenAPI spec using openapi-generator-cli (exec jar)'
	doFirst {
		// ensure the CLI jar is resolved
		configurations.openapiGenerator.resolve()
		def jar = configurations.openapiGenerator.singleFile
		file(openApiOutput).mkdirs()
		commandLine = [
			'java', '-jar', jar.absolutePath,
			'generate',
			'-g', 'spring',
			'-i', openApiInput,
			'-o', openApiOutput,
			'--api-package', openApiApiPackage,
			'--model-package', openApiModelPackage,
			'--invoker-package', openApiInvokerPackage,
			'--additional-properties', 'library=spring-boot,useBeanValidation=true,useOptional=true,dateLibrary=java8,useSpringBoot3=true',
			'--global-property', 'models=true,apis=true,supportingFiles=false'
		]
	}
}

// Include generated sources in the main source set so they are compiled automatically
sourceSets.main.java.srcDir file("${openApiOutput}/src/main/java")

tasks.named('compileJava') {
	dependsOn tasks.named('openApiGenerate')
}

// (generated sources already added above)

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

tasks.withType(JavaCompile).configureEach {
	options.annotationProcessorGeneratedSourcesDirectory = file("$buildDir/generated/sources/annotations")
	options.compilerArgs += ["-Amapstruct.defaultComponentModel=spring"]
}

jar {
	enabled = false
	archiveClassifier = ''
}

sonarqube {
	properties {
		property "sonar.projectKey", "archetype-spring-cloud-stream-vertical-slice"
		property "sonar.projectName", "Archetype Spring Cloud Stream Vertical Slice"
		property "sonar.host.url", "http://localhost:9000"
		property "sonar.token", System.getenv("SONAR_TOKEN")
		property "sonar.coverage.jacoco.xmlReportPaths", "${buildDir}/reports/jacoco/test/jacocoTestReport.xml"
	}
}
